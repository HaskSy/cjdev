[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "cjdev"
version = "0.1.0"
description = "Cangjie's developer utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dmitrii Chizha", email = "me@filaco.dev" }
]
keywords = ["cli", "utility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "gitpython>=3.1.46",
    "pydantic>=2.12.5",
    "questionary>=2.1.1",
    "rich>=14.2.0",
    "tomlkit>=0.14.0",
    "typer>=0.21.1",
]

[project.optional-dependencies]
dev = [
    "black>=23.1.0",
    "isort>=5.12.0",
    "pylint>=2.17.0",
    "pytest>=9.0.2",
    "pytest-cov>=4.0.0",
]

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cjdev = "cjdev:main"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.ty]
python-version = "3.10"
venvPath = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--strict-config"]

